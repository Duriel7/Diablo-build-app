services:
  web:
    build: .
    container_name: diablo-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: diablo-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: diablo
      MYSQL_USER: diablo
      MYSQL_PASSWORD: diablo
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  admin:
    image: phpmyadmin/phpmyadmin
    container_name: diablo-pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: diablo
      PMA_PASSWORD: diablo
    depends_on:
      - db

volumes:
  db_data:
